apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-app
  namespace: default

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-agent-config
  namespace: default
data:
  config.hcl: |
    exit_after_auth = false
    pid_file = "/home/vault/pidfile"

    auto_auth {
      method "kubernetes" {
        mount_path = "auth/kubernetes"
        config = {
          role = "payment-app"
        }
      }

      sink "file" {
        config = {
          path = "/home/vault/.vault-token"
        }
      }
    }

    template {
      source      = "/vault/templates/db-config.tmpl"
      destination = "/vault/secrets/db-config.env"
      perms       = "0400"
    }

    vault {
      address = "http://vault.default.svc.cluster.local:8200"
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-agent-template
  namespace: default
data:
  db-config.tmpl: |
    {{ with secret "secret/data/db" }}
    DB_PASSWORD={{ .Data.data.password }}
    DB_USERNAME={{ .Data.data.username }}
    DB_HOST={{ .Data.data.host }}
    DB_PORT={{ .Data.data.port }}
    DB_NAME={{ .Data.data.database }}
    {{ end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-app
  namespace: default
  labels:
    app: payment-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-app
  template:
    metadata:
      labels:
        app: payment-app
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-inject-secret-db-config.env: "secret/data/db"
        vault.hashicorp.com/agent-inject-template-db-config.env: |
          {{- with secret "secret/data/db" -}}
          DB_PASSWORD={{ .Data.data.password }}
          DB_USERNAME={{ .Data.data.username }}
          DB_HOST={{ .Data.data.host }}
          DB_PORT={{ .Data.data.port }}
          DB_NAME={{ .Data.data.database }}
          {{- end }}
        vault.hashicorp.com/role: "payment-app"
    spec:
      serviceAccountName: payment-app
      containers:
        - name: payment-app
          image: python:3.11-slim
          command: ["sh", "-c", "source /vault/secrets/db-config.env && echo 'Secrets loaded from Vault Agent' && env | grep DB_ && sleep 3600"]
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"

---
apiVersion: v1
kind: Service
metadata:
  name: payment-app
  namespace: default
spec:
  selector:
    app: payment-app
  ports:
    - port: 8080
      targetPort: 8080
